name: Voting System CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:
  build:

    name: Build and Test Voting System

    runs-on: ubuntu-latest

    steps:

      # 1. Download repository
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Install Java (Updated to v5 and removed unsupported Ant cache)
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 3. Check Java version
      - name: Check Java version
        run: java -version

      # 4. Build project using NetBeans Ant
      - name: Build project
        run: ant clean jar

      # 5. Upload generated JAR
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: VotingSystem-JAR
          path: dist/*.jar
