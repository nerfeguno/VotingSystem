name: Voting System CI

on:
  push:
    branches:
      - main
      - develop
    # Trigger the workflow when a version tag is pushed (e.g., v1.0.0)
    tags:
      - 'v*'

  pull_request:
    branches:
      - main
      - develop

# Grant the workflow permission to create a release
permissions:
  contents: write

jobs:
  build:

    name: Build and Test Voting System

    runs-on: ubuntu-latest

    steps:

      # 1. Download repository
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Install Java 21
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # 3. Check Java version
      - name: Check Java version
        run: java -version

      # 4. Build project using NetBeans Ant
      - name: Build project
        run: ant clean jar

      # 5. Upload generated JAR as a workflow artifact
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: VotingSystem-JAR
          path: dist/*.jar

      # 6. Publish GitHub Release (Only runs when a tag is pushed)
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*.jar
          generate_release_notes: true
